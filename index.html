<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Boda Sergio & Lorena</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { font-family: Arial; background: #f7f2ee; text-align:center; }
    h1 { font-size: 40px; }
    .box { background: white; padding:20px; margin:20px auto; max-width:600px; border-radius:15px; }
    input, select, textarea { width:100%; padding:10px; margin:5px 0; }
    button { padding:12px; background:black; color:white; border:none; cursor:pointer; }
  </style>
</head>

<body>

<h1>Sergio & Lorena</h1>
<p>2 Octubre 2027</p>
<p>Pinar del Pastor</p>

<div class="box">
  <h2>Confirma tu asistencia</h2>

  <form id="form">
    <input name="nombre" placeholder="Nombre" required>
    <input name="email" placeholder="Email" required>
    <select name="asistencia">
      <option value="si">Sí iré</option>
      <option value="no">No podré</option>
    </select>
    <textarea name="mensaje" placeholder="Mensaje"></textarea>
    <button type="submit">Enviar</button>
  </form>

  <p id="status"></p>
</div>

<iframe 
  src="https://www.google.com/maps?q=Pinar%20del%20Pastor&output=embed"
  width="100%" height="300">
</iframe>

<script>
const scriptURL = "https://script.google.com/home/projects/1J66QJfXNhj1y4G6RH34W0fMVVybsD--nIr-mRdA0EhgdjOSnE9QtEHeU/exec";

document.getElementById("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const data = Object.fromEntries(new FormData(e.target));
  
  await fetch(scriptURL, {
    method: "POST",
    body: JSON.stringify(data)
  });

  document.getElementById("status").innerText = "✅ Confirmación enviada";
});
</script>

</body>
</html>
